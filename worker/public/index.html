<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Goods In — trace</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Goods In" />
<meta name="theme-color" content="#f2f2f7" />
<style>
/* The form is used one-handed on a wet iPad at the goods-in door, so
   everything here is sized for a thumb rather than a cursor: 44px minimum
   targets, 17px text, and no hover-only affordances. */
:root {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --sunk: #efeff4;
  --line: #d8d8de;
  --text: #1c1c1e;
  --muted: #6c6c70;
  --tint: #0a6b3d;
  --tint-soft: #e6f2ea;
  --bad: #b3261e;
  --bad-soft: #fdeceb;
  --warn: #8a5a00;
  --warn-soft: #fff5e0;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --surface: #1c1c1e; --sunk: #2c2c2e; --line: #3a3a3c;
    --text: #f2f2f7; --muted: #98989f; --tint: #34c77b; --tint-soft: #10301f;
    --bad: #ff6961; --bad-soft: #3a1614; --warn: #ffd60a; --warn-soft: #3a3000;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: 0 0 env(safe-area-inset-bottom);
}
header {
  position: sticky; top: 0; z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 10px 16px calc(10px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
header h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -0.2px; }
.pill {
  font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--sunk); color: var(--muted); white-space: nowrap;
}
.pill.ok { background: var(--tint-soft); color: var(--tint); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
main { padding: 16px; max-width: 760px; margin: 0 auto; }
section {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
}
section > h2 {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--muted); margin: 0; padding: 12px 16px 6px;
}
.row { display: flex; gap: 12px; padding: 8px 16px 14px; flex-wrap: wrap; }
.field { flex: 1 1 200px; min-width: 0; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
input, select, button, textarea { font: inherit; }
input, select {
  width: 100%; min-height: 44px; padding: 10px 12px; color: var(--text);
  background: var(--sunk); border: 1px solid var(--line);
  border-radius: 10px; appearance: none;
}
input:focus, select:focus { outline: 2px solid var(--tint); outline-offset: -1px; }
button {
  min-height: 44px; padding: 11px 18px; border-radius: 10px; border: 1px solid transparent;
  background: var(--tint); color: #fff; font-weight: 600; cursor: pointer;
}
button.secondary { background: var(--sunk); color: var(--text); border-color: var(--line); }
button.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
button:disabled { opacity: 0.45; }
.actions { display: flex; gap: 10px; padding: 0 16px 16px; flex-wrap: wrap; }
.actions button { flex: 1 1 160px; }

.lines { list-style: none; margin: 0; padding: 0; }
.lines li { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
.lines .grow { flex: 1; min-width: 0; }
.lines .name { font-weight: 600; }
.lines .detail { font-size: 14px; color: var(--muted); margin-top: 2px; }
.code {
  font: 600 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  letter-spacing: 2px; background: var(--tint-soft); color: var(--tint);
  padding: 8px 10px; border-radius: 8px; white-space: nowrap;
}
.code.none { background: var(--warn-soft); color: var(--warn); font-size: 13px; letter-spacing: 0; }
.empty { padding: 16px; color: var(--muted); }

.note { padding: 0 16px 14px; font-size: 14px; color: var(--muted); }
.banner { padding: 12px 16px; font-size: 15px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.ok { background: var(--tint-soft); color: var(--tint); }

dialog {
  border: none; border-radius: 16px 16px 0 0; padding: 0; width: 100%; max-width: 620px;
  margin: auto auto 0; background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
dialog header { border-radius: 16px 16px 0 0; }
.queue-entry { border-top: 1px solid var(--line); padding: 12px 16px; font-size: 15px; }
.queue-entry .why { color: var(--bad); font-size: 14px; margin-top: 4px; }
.queue-entry .when { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <h1>Goods In</h1>
  <span class="pill" id="net">checking</span>
  <span class="pill" id="pool">codes —</span>
  <button class="secondary" id="open-queue" style="min-height:36px;padding:6px 12px;font-size:14px">Queue <span id="queue-count">0</span></button>
</header>

<main>
  <div id="alerts"></div>

  <section>
    <h2>Delivery</h2>
    <div class="row">
      <div class="field">
        <label for="staff">Who is booking this in</label>
        <select id="staff"></select>
      </div>
      <div class="field">
        <label for="supplier">Supplier</label>
        <select id="supplier"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="invoice">Invoice number</label>
        <input id="invoice" inputmode="numeric" autocomplete="off" placeholder="as printed on the delivery note" />
      </div>
      <div class="field">
        <label for="occurred">Arrived</label>
        <input id="occurred" type="datetime-local" />
      </div>
    </div>
  </section>

  <section>
    <h2>Cases received</h2>
    <ul class="lines" id="lines"></ul>
    <p class="empty" id="lines-empty">Nothing added yet. Add one line per ingredient on the delivery note.</p>
    <div class="actions">
      <button id="add-line">Add an ingredient</button>
    </div>
  </section>

  <section>
    <h2>Book it in</h2>
    <p class="note" id="submit-note"></p>
    <div class="actions">
      <button id="submit" disabled>Book this delivery in</button>
      <button class="secondary" id="discard">Discard</button>
    </div>
  </section>

  <section>
    <h2>This device</h2>
    <div class="row">
      <div class="field">
        <label for="device">Device</label>
        <select id="device"></select>
      </div>
    </div>
    <p class="note" id="device-note"></p>
  </section>
</main>

<dialog id="line-dialog">
  <header><h1 id="line-dialog-title">Add an ingredient</h1></header>
  <div class="row">
    <div class="field">
      <label for="line-item">Ingredient</label>
      <select id="line-item"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="line-quantity">How many</label>
      <input id="line-quantity" type="number" min="0" step="any" inputmode="decimal" />
    </div>
    <div class="field">
      <label for="line-unit">Of what</label>
      <select id="line-unit"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="line-location">Where it is going</label>
      <select id="line-location"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="line-use-by">Use-by printed on the box</label>
      <input id="line-use-by" type="date" />
    </div>
    <div class="field">
      <label for="line-batch">Batch number on the label</label>
      <input id="line-batch" autocomplete="off" />
    </div>
  </div>
  <p class="note" id="line-use-by-note"></p>
  <div id="line-error"></div>
  <div class="actions">
    <button id="line-save">Add to the delivery</button>
    <button class="secondary" id="line-cancel">Cancel</button>
  </div>
</dialog>

<dialog id="queue-dialog">
  <header><h1>Queue</h1></header>
  <div id="queue-body"></div>
  <div class="actions">
    <button id="queue-sync">Send now</button>
    <button class="secondary" id="queue-clear">Clear the sent ones</button>
    <button class="secondary" id="queue-close">Close</button>
  </div>
</dialog>

<script type="module" src="/goods-in.js"></script>
</body>
</html>
