<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Goods In — trace</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Goods In" />
<meta name="theme-color" content="#f2f2f7" />
<!-- Added to the home screen the form keeps its stored queue: iOS clears site
     data after seven unused days, and installed web apps are exempt. -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>

<header>
  <h1>Goods In</h1>
  <span class="pill" id="net">checking</span>
  <span class="pill" id="pool">codes —</span>
  <a href="/stock" class="pill" style="text-decoration:none">Stock →</a>
  <button class="secondary" id="open-holds" style="min-height:36px;padding:6px 12px;font-size:14px">Held <span id="holds-count">0</span></button>
  <button class="secondary" id="open-queue" style="min-height:36px;padding:6px 12px;font-size:14px">Queue <span id="queue-count">0</span></button>
</header>

<main>
  <div id="alerts"></div>

  <section>
    <h2>Delivery</h2>
    <div class="row">
      <div class="field">
        <label for="staff">Who is booking this in</label>
        <select id="staff"></select>
      </div>
      <div class="field">
        <label for="supplier">Supplier</label>
        <select id="supplier"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="invoice">Invoice number</label>
        <input id="invoice" inputmode="numeric" autocomplete="off" placeholder="as printed on the delivery note" />
      </div>
      <div class="field">
        <label for="occurred">Arrived</label>
        <input id="occurred" type="datetime-local" />
      </div>
    </div>
  </section>

  <section>
    <h2>Cases received</h2>
    <ul class="lines" id="lines"></ul>
    <p class="empty" id="lines-empty">Nothing added yet. Add one line per ingredient on the delivery note.</p>
    <div class="actions">
      <button id="add-line">Add an ingredient</button>
    </div>
  </section>

  <section>
    <h2>Vehicle check</h2>
    <div class="row">
      <div class="field">
        <label for="vehicle-condition">Condition of the vehicle</label>
        <select id="vehicle-condition">
          <option value="good">Good</option>
          <option value="poor">Poor</option>
        </select>
      </div>
      <div class="field" id="vehicle-note-field" hidden>
        <label for="vehicle-note">What was wrong with it</label>
        <input id="vehicle-note" autocomplete="off" placeholder="door seal, dirty, load not secured…" />
      </div>
    </div>
    <div class="row">
      <div class="field" id="vehicle-chilled-field" hidden>
        <label for="vehicle-chilled">Chilled compartment °C</label>
        <input id="vehicle-chilled" type="number" step="0.1" inputmode="decimal" />
      </div>
      <div class="field" id="vehicle-frozen-field" hidden>
        <label for="vehicle-frozen">Frozen compartment °C</label>
        <input id="vehicle-frozen" type="number" step="0.1" inputmode="decimal" />
      </div>
    </div>
    <p class="note" id="vehicle-note-hint"></p>
  </section>

  <section>
    <h2>Condition check</h2>
    <ul class="attest" id="attest">
      <li><label><input type="checkbox" id="condition-ok" /> Goods arrived in good condition</label></li>
      <li><label><input type="checkbox" id="labels-applied" /> Goods-in labels applied to every case</label></li>
      <li><label><input type="checkbox" id="allergens-confirmed" /> Allergens checked against the delivery note</label></li>
    </ul>
    <p class="note" id="submit-note"></p>
    <div class="actions">
      <button id="submit" disabled>Save goods in record</button>
      <button class="secondary" id="discard">Clear this delivery</button>
    </div>
  </section>

  <!-- The device row is shown only when there is a genuine choice to make.
       The kitchen has one iPad, so normally there is not, and asking would be
       a question with one possible answer. -->
  <section id="device-section" class="footnote">
    <h2>This device</h2>
    <div class="row" id="device-row" hidden>
      <div class="field">
        <label for="device">Device</label>
        <select id="device"></select>
      </div>
    </div>
    <p class="note" id="device-note"></p>
  </section>

</main>

<dialog id="line-dialog">
  <header><h1 id="line-dialog-title">Add an ingredient</h1></header>
  <div class="chosen" id="line-chosen"></div>
  <div class="row">
    <div class="field">
      <label for="line-quantity">How many</label>
      <input id="line-quantity" type="number" min="0" step="any" inputmode="decimal" />
    </div>
    <div class="field">
      <label for="line-unit">Of what</label>
      <select id="line-unit"></select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="line-location">Where it is going</label>
      <select id="line-location"></select>
    </div>
  </div>
  <div class="row" id="line-temp-row" hidden>
    <div class="field">
      <label for="line-temp" id="line-temp-label">Product temperature °C</label>
      <input id="line-temp" type="number" step="0.1" inputmode="decimal" />
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label for="line-use-by">Use-by printed on the box</label>
      <input id="line-use-by" type="date" />
    </div>
    <div class="field">
      <label>Batch number on the label</label>
      <output class="derived" id="line-batch"></output>
    </div>
  </div>
  <p class="note" id="line-use-by-note"></p>
  <div id="line-error"></div>
  <div class="actions">
    <button id="line-save">Add to the delivery</button>
    <button class="secondary" id="line-back">Pick a different one</button>
    <button class="secondary" id="line-cancel">Cancel</button>
  </div>
</dialog>

<dialog id="picker-dialog">
  <header><h1>Tap an ingredient</h1></header>
  <div class="picker-search">
    <input id="picker-search" type="search" placeholder="Search by name" autocomplete="off" />
    <p class="note" id="picker-scope"></p>
  </div>
  <div class="picker-groups" id="picker-groups"></div>
  <div class="actions">
    <button class="secondary" id="picker-cancel">Cancel</button>
  </div>
</dialog>

<dialog id="holds-dialog">
  <header><h1>Stock held on temperature</h1></header>
  <div id="holds-body"></div>
  <div class="actions">
    <button class="secondary" id="holds-refresh">Refresh</button>
    <button class="secondary" id="holds-close">Close</button>
  </div>
</dialog>

<dialog id="queue-dialog">
  <header><h1>Queue</h1></header>
  <div id="queue-body"></div>
  <div class="actions">
    <button id="queue-sync">Send now</button>
    <button class="secondary" id="queue-clear">Clear the sent ones</button>
    <button class="secondary" id="queue-close">Close</button>
  </div>
</dialog>

<script type="module" src="/goods-in.js"></script>
</body>
</html>
