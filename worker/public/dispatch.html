<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Dispatch — trace</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dispatch" />
<meta name="theme-color" content="#f2f2f7" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/app.css" />
<style>
/* Dispatch is done inside, on wifi, at the freezer (Dean, 2026-09-04), so it
   reads live balances rather than caching them — the same reasoning as the
   stock and batching screens. */
.lot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; }
.lot .grow { flex: 1; min-width: 0; }
.lot .name { font-weight: 600; }
.lot .detail { font-size: 14px; color: var(--muted); margin-top: 2px; }
.lot .qty { font: 600 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
.lot .soon { color: var(--bad); font-weight: 600; }
.line { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
.line .grow { flex: 1; min-width: 0; }
.line .detail { font-size: 14px; color: var(--muted); margin-top: 2px; }
.line button { min-height: 38px; flex: none; }
</style>
</head>
<body>

<header>
  <h1>Dispatch</h1>
  <span class="pill" id="net">checking</span>
  <a href="/" class="pill" style="text-decoration:none">Goods In</a>
  <a href="/stock" class="pill" style="text-decoration:none">Stock</a>
  <a href="/batches" class="pill" style="text-decoration:none">Batches</a>
</header>

<main>
  <div id="alerts"></div>

  <section>
    <h2>Where it is going</h2>
    <div class="row">
      <div class="field">
        <label for="staff">Who is sending it</label>
        <select id="staff"></select>
      </div>
      <div class="field">
        <label for="customer">Customer</label>
        <select id="customer"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="reference">Their order or note number (optional)</label>
        <input id="reference" autocomplete="off" />
      </div>
      <div class="field">
        <label for="vehicle-condition">Vehicle condition</label>
        <select id="vehicle-condition">
          <option value="">Choose</option>
          <option value="good">Good</option>
          <option value="poor">Poor</option>
        </select>
      </div>
    </div>
    <!-- Asked for only when the load carries that class of stock. The server
         refuses a reading for a class that is not in the load and refuses a
         missing one for a class that is, so these are not optional once shown. -->
    <div class="row" id="vehicle-temps" hidden>
      <div class="field" id="chilled-field" hidden>
        <label for="vehicle-chilled" id="chilled-label">Van chilled temperature (°C)</label>
        <input id="vehicle-chilled" type="number" step="any" inputmode="decimal" />
      </div>
      <div class="field" id="frozen-field" hidden>
        <label for="vehicle-frozen" id="frozen-label">Van frozen temperature (°C)</label>
        <input id="vehicle-frozen" type="number" step="any" inputmode="decimal" />
      </div>
    </div>
  </section>

  <section id="lines-section" hidden>
    <h2>What is going</h2>
    <ul class="lines" id="lines"></ul>
  </section>

  <section>
    <h2>Add a product</h2>
    <div class="row">
      <div class="field">
        <label for="search">Search by product or code</label>
        <input id="search" type="search" autocomplete="off" placeholder="broth, K7M4QP…" />
      </div>
    </div>
    <ul class="lines" id="lots"></ul>
    <p class="empty" id="lots-empty">Loading…</p>
  </section>

  <section>
    <p class="note" id="finish-note"></p>
    <div class="actions">
      <button id="save" disabled>Record the dispatch</button>
      <button class="secondary" id="discard">Clear it</button>
    </div>
  </section>
</main>

<dialog id="line-dialog">
  <header><h1 id="line-title">How much</h1></header>
  <div class="chosen" id="line-chosen"></div>
  <p class="note" id="line-where"></p>
  <div class="row">
    <div class="field">
      <label for="line-quantity" id="line-quantity-label">How much</label>
      <input id="line-quantity" type="number" step="any" min="0" inputmode="decimal" />
    </div>
  </div>
  <div id="line-error"></div>
  <div class="actions">
    <button id="line-add">Add it</button>
    <button class="secondary" id="line-cancel">Cancel</button>
  </div>
</dialog>

<script type="module" src="/dispatch.js"></script>
</body>
</html>
