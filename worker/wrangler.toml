# The `trace` Worker — ingredient traceability and kitchen production records.
# P1 scope: the catalog, the ledger, and the goods intake form over both.
name = "trace"
main = "src/index.js"
compatibility_date = "2026-08-31"

# Off deliberately (2026-09-17). The ledger routes have no authentication yet
# (PLAN.md, open question "Authentication"), and trace.waiyandean.workers.dev
# would reach every one of them from the open internet. The label GUI needs
# none of that -- it only reaches this Worker through the zone route below,
# which exposes exactly the paths named in it and nothing else.
workers_dev = false

# The label GUI, the one piece of this Worker that is meant to be public
# today, at forms.deanops.uk/labels -- a route on the old forms system's zone
# rather than a domain of trace's own, since trace has none yet (PLAN.md, "is
# it possible to host this on Cloudflare"). Three patterns because the page,
# its own /api/labels/* calls and the shared /photos/* images are not all
# under one path; each pattern reaches only what it names, so nothing else on
# this Worker -- the ledger above all -- becomes reachable from that zone.
routes = [
  { pattern = "forms.deanops.uk/labels*", zone_name = "deanops.uk" },
  { pattern = "forms.deanops.uk/api/labels*", zone_name = "deanops.uk" },
  { pattern = "forms.deanops.uk/photos*", zone_name = "deanops.uk" },
]

# The forms themselves, served as static assets from the same origin as the
# API. Same origin matters: the iPad is on kitchen wifi with no certificate of
# its own, and a cross-origin form would need CORS and a second thing to keep
# deployed in step.
#
# `run_worker_first` keeps /api/* with the Worker. Without it a request that
# happened to match a file name would be served as an asset, and an endpoint
# would silently stop existing.
[assets]
directory = "public"
run_worker_first = ["/api/*"]

# The traceability database. This is a NEW database, deliberately empty: the
# old `forms-traceability` D1 and the Sheets before it are frozen as a
# read-only archive (PLAN.md, "History: clean start, legacy read-only").
# Created 2026-08-31 in WEUR.
[[d1_databases]]
binding = "DB"
database_name = "trace"
database_id = "3902b45f-e493-49cb-bf10-8eaf7a19bb31"
migrations_dir = "migrations"
